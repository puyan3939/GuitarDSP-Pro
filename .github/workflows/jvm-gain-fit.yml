name: JVM410H Gain Measured Fit

on:
  push:
    branches:
      - agent/signal-analyzer
    paths:
      - '.github/workflows/jvm-gain-fit.yml'
      - 'CMakeLists.txt'
      - 'hq_preload/dsp/amp/**'
      - 'tests/JVMGainFit.cpp'
  pull_request:
    paths:
      - '.github/workflows/jvm-gain-fit.yml'
      - 'CMakeLists.txt'
      - 'hq_preload/dsp/amp/**'
      - 'tests/JVMGainFit.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guitardsp-jvm-gain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gain-fit:
    name: Fit measured JVM410H OD1 Gain axis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout GuitarDSP-Pro
        uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config ccache python3-pip \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev
          python3 -m pip install --break-system-packages remotezip
      - name: Checkout JUCE 9.0.0
        uses: actions/checkout@v5
        with:
          repository: juce-framework/JUCE
          ref: 9.0.0
          path: _deps/JUCE
          fetch-depth: 1
      - name: Fetch compact measured Gain set from ToneTwisT ZIP
        shell: python
        run: |
          import pathlib, re, shutil
          from remotezip import RemoteZip

          url = 'https://zenodo.org/records/10892012/files/Marshall-JVM410H-ChOD1.zip?download=1'
          out = pathlib.Path('jvm-gain-data')
          if out.exists(): shutil.rmtree(out)
          out.mkdir()

          pattern = re.compile(r'B([0-9.]+)_M([0-9.]+)_T([0-9.]+)_G([0-9.]+)', re.I)
          wanted = [0.0, 2.0, 4.0, 5.0, 6.0, 8.0, 10.0]
          holdout = {2.0, 6.0}

          def knob(raw):
              v = float(raw)
              return v / 10.0 if v > 10.0 else v

          with RemoteZip(url) as rz:
              names = [n for n in rz.namelist() if not n.endswith('/')]
              infos = {n: rz.getinfo(n) for n in names}
              inputs_by_base = {}
              for n in names:
                  if n.lower().endswith('.input.wav'):
                      inputs_by_base.setdefault(pathlib.PurePosixPath(n).name, []).append(n)

              candidates = []
              for target in names:
                  if not target.lower().endswith('.target.wav'):
                      continue
                  m = pattern.search(target)
                  if not m:
                      continue
                  b, mid, treble, gain = [knob(x) for x in m.groups()]
                  gain = round(gain, 3)
                  if gain not in wanted:
                      continue
                  target_base = pathlib.PurePosixPath(target).name
                  first, sep, rest = target_base.partition('.')
                  input_base = rest.replace('.target.wav', '.input.wav') if sep else target_base.replace('.target.wav', '.input.wav')
                  matches = inputs_by_base.get(input_base, [])
                  if not matches:
                      continue
                  target_parts = pathlib.PurePosixPath(target).parts
                  split_tokens = [p.lower() for p in target_parts if p.lower() in ('trainval','train','val','test')]
                  if split_tokens:
                      same = [p for p in matches if any('/'+s+'/' in '/'+p.lower()+'/' for s in split_tokens)]
                      if same: matches = same
                  for input_path in matches:
                      centre_distance = abs(b-5.0) + abs(mid-5.0) + abs(treble-5.0)
                      compressed_bytes = infos[target].compress_size + infos[input_path].compress_size
                      candidates.append((gain, centre_distance, compressed_bytes, target, input_path, b, mid, treble))

              # Prefer one common dry input across all Gain positions. This avoids
              # downloading the same several-minute dry recording seven times.
              by_input = {}
              for c in candidates:
                  by_input.setdefault(c[4], {}).setdefault(c[0], []).append(c)
              complete = []
              for input_path, by_gain in by_input.items():
                  if all(g in by_gain for g in wanted):
                      picked = {g: min(by_gain[g], key=lambda c: (c[1], infos[c[3]].compress_size)) for g in wanted}
                      target_bytes = sum(infos[picked[g][3]].compress_size for g in wanted)
                      score = infos[input_path].compress_size + target_bytes
                      complete.append((score, sum(picked[g][1] for g in wanted), input_path, picked))

              selected = {}
              shared_input = None
              if complete:
                  _, _, shared_input, selected = min(complete, key=lambda x: (x[0], x[1]))
                  print('Using one shared dry input:', shared_input)
              else:
                  print('No one dry source covers all Gain positions; choosing the smallest valid pair per Gain.')
                  for gain in wanted:
                      choices = [c for c in candidates if c[0] == gain]
                      if not choices:
                          available = sorted(set(c[0] for c in candidates))
                          raise SystemExit(f'Missing Gain={gain}; available Gain values: {available}')
                      selected[gain] = min(choices, key=lambda c: (c[2], c[1]))

              input_destinations = {}
              lines = ['# split name bass middle treble gain input target']
              for gain in wanted:
                  _, distance, compressed_bytes, target, input_path, b, mid, treble = selected[gain]
                  tag = str(int(gain))
                  if input_path not in input_destinations:
                      in_dest = out / f'dry{len(input_destinations)}.wav'
                      print(f'Downloading dry ({infos[input_path].compress_size / 1048576:.1f} MiB compressed):', input_path)
                      with rz.open(input_path) as src, in_dest.open('wb') as dst: shutil.copyfileobj(src, dst)
                      input_destinations[input_path] = in_dest
                  in_dest = input_destinations[input_path]
                  target_dest = out / f'g{tag}_target.wav'
                  print(f'Downloading Gain {gain:g} wet ({infos[target].compress_size / 1048576:.1f} MiB compressed):', target)
                  with rz.open(target) as src, target_dest.open('wb') as dst: shutil.copyfileobj(src, dst)
                  split = 'holdout' if gain in holdout else 'fit'
                  lines.append(f'{split} G{tag} {b:g} {mid:g} {treble:g} {gain:g} {in_dest.name} {target_dest.name}')
                  print(f'Gain {gain:g}: B={b:g} M={mid:g} T={treble:g}, centre distance={distance:g}, pair={compressed_bytes / 1048576:.1f} MiB')

              (out / 'manifest.tsv').write_text('\n'.join(lines) + '\n', encoding='utf-8')
              print((out / 'manifest.tsv').read_text())
      - name: Configure Gain fitter
        run: |
          cmake -S . -B build-gain -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DGUITARDSP_FETCH_FACTORY_IRS=OFF \
            -DGUITARDSP_JUCE_PATH="${{ github.workspace }}/_deps/JUCE"
      - name: Build Gain fitter
        run: cmake --build build-gain --target GuitarDSPJVMGainFit --parallel 4
      - name: Fit Gain axis and score unseen Gain values
        run: |
          set -o pipefail
          ./build-gain/GuitarDSPJVMGainFit_artefacts/Release/GuitarDSPJVMGainFit \
            jvm-gain-data/manifest.tsv jvm-gain-fit-report.json | tee jvm-gain-fit-log.txt
      - name: Publish Gain fit report
        uses: actions/upload-artifact@v4
        with:
          name: jvm410h-od1-gain-fit
          path: |
            jvm-gain-fit-report.json
            jvm-gain-fit-log.txt
            jvm-gain-data/manifest.tsv
          if-no-files-found: error
          retention-days: 30

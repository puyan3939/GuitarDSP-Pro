name: Factory IR Fetch

on:
  push:
    branches: [agent/signal-analyzer]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download Brutal IR Pack
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            'https://www.jester-dyne-productions.com/content/files/2023/04/JestersBrutalPack_1.0.zip' \
            -o brutal.zip
          sha256sum brutal.zip | tee factory-ir-source.sha256
          unzip -q brutal.zip -d brutal
          find brutal -maxdepth 6 -type f -print | sort
      - name: Extract and validate 48 kHz WAVs
        shell: python
        run: |
          import pathlib, shutil, wave, json
          src = pathlib.Path('brutal')
          out = pathlib.Path('factory-ir-48k')
          out.mkdir()
          manifest=[]
          for p in sorted(src.rglob('*.wav')):
              try:
                  with wave.open(str(p), 'rb') as w:
                      rate=w.getframerate(); channels=w.getnchannels(); frames=w.getnframes(); width=w.getsampwidth()
              except wave.Error:
                  continue
              if rate != 48000:
                  continue
              dest=out / p.name
              shutil.copy2(p,dest)
              manifest.append({'file':p.name,'sampleRate':rate,'channels':channels,'frames':frames,'sampleWidth':width})
          if len(manifest) != 15:
              raise SystemExit(f'Expected 15 48 kHz IRs, found {len(manifest)}')
          pathlib.Path('factory-ir-manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(json.dumps(manifest, indent=2))
      - name: Upload Factory IR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jester-brutal-factory-ir-48k
          path: |
            factory-ir-48k/*.wav
            factory-ir-manifest.json
            factory-ir-source.sha256
          if-no-files-found: error
          retention-days: 7

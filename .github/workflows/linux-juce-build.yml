name: Linux JUCE Build

on:
  push:
    branches: [ "main", "master", "develop", "phase*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JUCE 9.0.0 / gcc
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout GuitarDSP-Pro
        uses: actions/checkout@v4

      - name: Install minimal JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev

      - name: Checkout JUCE 9.0.0
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 9.0.0
          path: _deps/JUCE
          fetch-depth: 1

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGUITARDSP_JUCE_PATH="${{ github.workspace }}/_deps/JUCE"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Show resulting binary
        if: success()
        run: find build -maxdepth 6 -type f -perm -111 -print || true
